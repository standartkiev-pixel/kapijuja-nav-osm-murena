name: Build Kapijuja Murena ARM64 debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, critical-pass-2026-09-03 ]
    paths:
      - 'cardinal-android/**'
      - 'cardinal-geocoder/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-stock-murena-apk.yml'
      - '.github/keys/kapijuja-ci-debug.keystore'

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '29.0.14206865'
  ANDROID_CMAKE_VERSION: '3.22.1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true'
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: kapijuja-final-${{ github.run_number }}

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2026.07.1-ndk
    timeout-minutes: 90

    steps:
      - name: Checkout canonical Murena/Kapijuja source
        uses: actions/checkout@v4

      - name: Install stable Kapijuja CI debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/.github/keys/kapijuja-ci-debug.keystore" "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Prepare upstream Murena Android/Rust environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs curl unzip protobuf-compiler
          git lfs install --local
          git lfs pull

          if [ ! -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ]; then
            yes | sdkmanager "ndk;$ANDROID_NDK_VERSION" || true
          fi
          if [ ! -d "$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION" ]; then
            yes | sdkmanager "cmake;$ANDROID_CMAKE_VERSION" || true
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          cargo install cargo-ndk || true

          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          java -version
          rustc --version
          cargo --version

      - name: Verify imported upstream provenance
        shell: bash
        run: |
          set -euxo pipefail
          echo "Imported Murena upstream commit: $(cat UPSTREAM_MURENA_COMMIT)"
          echo "Imported Murena upstream repository: $(cat UPSTREAM_MURENA_REPOSITORY)"
          git lfs ls-files

      - name: Configure Android SDK path
        working-directory: cardinal-android
        shell: bash
        run: |
          set -euxo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Generate upstream Rust UniFFI bindings
        working-directory: cardinal-android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew generateUniFFIBindings --stacktrace --no-daemon 2>&1 | tee ../generate-uniffi.log

      - name: Run ARM64 unit tests
        working-directory: cardinal-android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew testArm64DebugUnitTest --stacktrace --no-daemon 2>&1 | tee ../test-arm64-debug.log

      - name: Build ARM64 debug APK
        working-directory: cardinal-android
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew assembleArm64Debug --info --stacktrace --no-daemon 2>&1 | tee ../build-arm64-debug.log

      - name: Show generated APK metadata
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          find cardinal-android/app/build/outputs/apk/arm64/debug -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \; -exec sha256sum {} \;

      - name: Upload Kapijuja online vehicle test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kapijuja-Murena-Final-arm64-debug
          path: cardinal-android/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kapijuja-Murena-Final-build-logs
          path: |
            generate-uniffi.log
            test-arm64-debug.log
            build-arm64-debug.log
          if-no-files-found: warn
          retention-days: 14
