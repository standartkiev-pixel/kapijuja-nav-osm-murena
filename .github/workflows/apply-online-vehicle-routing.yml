name: Apply online Truck and Bus routing patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-online-vehicle-routing.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply high-level online vehicle routing patch
        shell: bash
        run: python3 .github/scripts/apply_online_vehicle_routing.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'BUS("bus"' -n cardinal-android/app/src/main/java/earth/maps/cardinal/data/RoutingMode.kt
          grep -R 'RoutingMode.BUS -> ferrostarWrapperRepository.bus' -n cardinal-android/app/src/main/java/earth/maps/cardinal/ui
          grep -R 'val lineBus: Boolean = false' -n cardinal-android/app/src/main/java/earth/maps/cardinal/routing/RoutingOptions.kt
          grep -R 'fun RoutingMode.supportsTraffic(): Boolean = this == RoutingMode.AUTO' -n cardinal-android/app/src/main/java/earth/maps/cardinal/routing/FerrostarWrapper.kt
          git diff --check
          git diff --stat

      - name: Commit canonical source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kapijuja Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cardinal-android KAPIJUJA_PROJECT_LOG.md
          git commit -m 'Fix online Truck routing and add Bus coach/line profiles'
          git push origin HEAD:main
